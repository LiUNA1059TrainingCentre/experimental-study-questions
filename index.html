    :root {

      --text: #f8fafc;

      --accent: #f59e0b;

    * {

      margin: 0;
      padding: 0;
    }

    body {

      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.25rem;
      min-height: 100vh;
    }

    .app-container {

      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .title-group h1 {

      letter-spacing: 0.02em;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .score-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .pill span {
      color: var(--accent);
    }

      background: var(--bg);
      border-radius: 999px;
